; PlatformIO Project Configuration File
; Dual firmware: sender / receiver (ESP-NOW on ESP-01)

[platformio]
default_envs = sender, receiver

[env]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
build_flags =
	-DLED_PIN=2
	-DWIFI_CHANNEL=1
	-DSERIAL_BAUD=115200

[env:sender]
build_src_filter = +<sender/>
build_flags =
	${env.build_flags}
	-DNODE_SENDER
	-DBRIDGE_IDLE_MS=8
	-DBRIDGE_MAX_CHUNK=200

[env:receiver]
build_src_filter = +<receiver/>
build_flags =
	${env.build_flags}
	-DNODE_RECEIVER
