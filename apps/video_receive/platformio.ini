; ESP32 SoftAP only (TFT/pull/SD disabled for now)
; Pair with apps/video_send Phone Web live + phone-side record

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; only main SoftAP firmware; legacy avi_mjpeg kept on disk but not built
build_src_filter = +<main.cpp>

; TFT/SD libs kept in ini for future re-enable; not required while SoftAP-only
lib_deps =
	adafruit/Adafruit GFX Library @ ^1.11.11
	adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
	Bodmer/TJpg_Decoder @ ^1.1.0
